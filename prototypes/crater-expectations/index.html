// ---- Drawing ----------------------------------------------------------------------------
const SKY_R0 = 2, SKY_ROWS = 10, SKY_C0 = 1, SKY_COLS = 140, EL_MAX = 5.2, EL_MIN = -1.3;

/**

    const nx = x / RX, ny = y / RY, q = nx * nx + ny * ny;

// ---- First person: the view ray-marched every frame from a moving camera ----------------
// Each column marches out across the heightfield with lunar curvature; each hit is lit from the light grids

const VB = { n: 0 };

  bottomText(0, 44, COLS, orbit ? (state.view === 'pov' ? 'ARROWS move scout · Q/E look · V map · F flag · [ ] hour · ENTER land · ESC pause · M mute' : 'ARROWS move scout · F flag · [ ] landing hour · 1-3 jump · V ground view · ENTER land · ESC · M')
    : 'INSTRUMENTS · release TAB (or V) for the visor · W/S A/D keep driving · ESC pause · M mute', C.uiDim);
}
function composeDialog() {
  const d = state.dialog, w = 80, lines = wrap(d.text, w - 6), h = lines.length + 6, c0 = 11, r0 = 18;
  fillRect(c0, r0, w, h, ' ', '#000');
  box(c0, r0, w, h, C.ui, d.title, C.amber);
  let left = Math.floor(d.shown);
  lines.forEach((l, i) => { const n = Math.max(0, Math.min(l.length, left)); str(c0 + 3, r0 + 2 + i, l.slice(0, n), C.ui); left -= l.length + 1; });
  if (d.shown >= d.text.length) str(c0 + w - 22, r0 + h - 2, Math.floor(state.anim * 2) % 2 ? '[ENTER] CONTINUE' : '[ENTER] CONTINUE_', C.amber);
}
function overlayBox(title, lines, foot, col = C.ui) {
  const w = 70, h = lines.length + 6, c0 = Math.floor((COLS - w) / 2), r0 = 16;
  fillRect(c0, r0, w, h, ' ', '#000'); box(c0, r0, w, h, col, title, C.amber);
  lines.forEach(([t, c], i) => strC(r0 + 2 + i, t, c || C.ui, c0, w));
  strC(r0 + h - 2, foot, C.amber, c0, w);
}

// ---- Title logo, drawn in characters ----------------------------------------------------
const GLYPH = {
  A: [' ### ', '#   #', '#####', '#   #', '#   #'], C: [' ####', '#    ', '#    ', '#    ', ' ####'],
  E: ['#####', '#    ', '#### ', '#    ', '#####'], I: ['###', ' # ', ' # ', ' # ', '###'],
  N: ['#   #', '##  #', '# # #', '#  ##', '#   #'], O: [' ### ', '#   #', '#   #', '#   #', ' ### '],
  P: ['#### ', '#   #', '#### ', '#    ', '#    '], R: ['#### ', '#   #', '#### ', '#  # ', '#   #'],
  S: [' ####', '#    ', ' ### ', '    #', '#### '], T: ['#####', '  #  ', '  #  ', '  #  ', '  #  '],
  X: ['#   #', ' # # ', '  #  ', ' # # ', '#   #'],
};
function logoWord(word, r0, reveal) {
  const widths = [...word].map(ch => GLYPH[ch][0].length + 1), total = widths.reduce((a, b) => a + b, 0) * 2 - 2;
  let x = Math.floor((COLS - total) / 2);
  const shades = ['#ffe2a8', '#ffc76a', '#ffb347', '#e8902c', '#b86a1c'];
  for (const ch of word) {
    const g = GLYPH[ch];
    for (let r = 0; r < 5; r++) for (let c = 0; c < g[r].length; c++) {
      if (g[r][c] !== '#' || x + c * 2 > reveal) continue;
      put(x + c * 2 + 1, r0 + r + 1, '░', '#4a2e10'); put(x + c * 2 + 2, r0 + r + 1, '░', '#4a2e10');
      put(x + c * 2, r0 + r, '█', shades[r]); put(x + c * 2 + 1, r0 + r, '█', shades[r]);
    }
    x += g[0].length * 2 + 2;
  }
}
const titleProf = () => profile(78, 8);

// ---- Scenes ---------------------------------------------------------------------------
function tickAnims(dt) {
  state.anim += dt;
  for (const q of state.particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92; q.vy *= 0.92; q.life -= dt; }
  state.particles = state.particles.filter(q => q.life > 0);
  for (const q of state.vfx) { q.u += q.vu * dt; q.v += q.vv * dt; q.vv += 0.9 * dt; q.life -= dt; }
  state.vfx = state.vfx.filter(q => q.life > 0 && q.v < 1.02);
  for (const p of state.pulses) p.t += dt;
  state.pulses = state.pulses.filter(p => p.t < 1.1);
  for (const m of state.msgs) {
    m.age += dt;
    if (m.shown < m.text.length) { m.shown += 70 * dt; if (Math.floor(m.shown) % 3 === 0) sfx.click(); }
    else if (m.capcom && !m.closed) { m.closed = true; sfx.quindar(false); } // the out-tone: CAPCOM is done talking
  }
  if (state.dialog && state.dialog.shown < state.dialog.text.length) { state.dialog.shown += 75 * dt; sfx.click(); }
  if (state.launchAsk > 0) state.launchAsk = Math.max(0, state.launchAsk - dt);
}
/** What the music should feel: every layer reads the world, so the score tells you the stakes before the HUD does. */
function playMood() {
  const s = state.sky;
  if (!s) return { warm: 1, home: 1 };
  if (state.phase === 'orbit') return { warm: s.sunVis ? 1 : 0, cold: s.sunVis ? 0 : 1, home: s.earthVis ? 1 : 0 };
  const R = state.rover, toDep = state.depart - state.t, away = landerDist() > tune.board_radius;
  const dusk = s.sunVis && s.sunNext !== null && s.sunNext < tune.dusk_hours ? 1 - s.sunNext / tune.dusk_hours : 0;
  const battD = state.battery < tune.danger_batt ? 0.35 + 0.65 * (1 - state.battery / tune.danger_batt) : 0;
  const depD = away && toDep < tune.danger_depart ? 0.35 + 0.65 * (1 - toDep / tune.danger_depart) : 0;
  const danger = clamp(Math.max(battD, depD), 0, 1);
  const oob = state.oob > 0 ? clamp(0.3 + 0.7 * state.oob / tune.oob_seconds, 0, 1) : 0;
  const sp = Math.abs(R.v) / tune.rover_speed;
  return {
    warm: s.sunVis ? 1 : 0, cold: s.sunVis ? 0 : 1, dusk, home: s.lEarth ? 1 : 0, hollow: s.earthVis || s.lEarth ? 0 : 1,
    danger, oob, speed: sp, steer: Math.abs(R.steer) * Math.min(1, sp * 2), rough: R.rough * Math.min(1, sp * 3),
    breath: 1, tension: danger > 0 || dusk > 0.5 ? 1 : 0,
  };
}
/** The scout over the site: move, flag, scrub the landing hour, look from the ground (V, Q/E turn). */
function orbitUpdate(dt) {
  if (pressed('KeyV')) { state.view = state.view === 'pov' ? 'map' : 'pov'; sfx.servo(); }
  if (state.view === 'pov') {
    const tl = down.has('KeyQ') || down.has('Comma'), tr = down.has('KeyE') || down.has('Period');
    if (tl !== tr) state.hd = (state.hd + (tr ? 1 : -1) * tune.turn_rate * dt + 360) % 360;
  }
  const mv = moveInput(dt);
  if (mv) {
    state.cursor.c = clamp(state.cursor.c + mv[0], 0, MC - 1);
    state.cursor.r = clamp(state.cursor.r + mv[1], 0, MR - 1);
    updateSky(); sfx.telemetry();
  }
  if (pressed('KeyF')) {
    if (state.flags.length >= 3) state.flags.shift();
    state.flags.push({ c: state.cursor.c, r: state.cursor.r }); sfx.beep(1046);
    const st = statsFor(state.cursor.c, state.cursor.r);
    radio(`FLAG ${state.flags.length}: Sun ${st.sun}% · Earth ${st.earth}% over the mission.`, C.ui);
  }
  ['Digit1', 'Digit2', 'Digit3'].forEach((k, i) => { if (pressed(k) && state.flags[i]) { state.cursor = { ...state.flags[i] }; updateSky(); sfx.beep(); } });
  const lo = state.landMin, hi = state.landMin + tune.land_window;
  if (pressed('BracketRight') && state.landOff < hi) { state.landOff = Math.min(hi, state.landOff + tune.scrub_step); updateSky(); sfx.servo(); }
  if (pressed('BracketLeft') && state.landOff > lo) { state.landOff = Math.max(lo, state.landOff - tune.scrub_step); updateSky(); sfx.servo(); }
  lightTick(state.landOff, 3000); relight();
  if (pressed('Enter') || pressed('Space')) land();
}
/** The surface, in real time: drive, work, launch, and the clock never stops. */
function surfaceUpdate(dt) {
  const R = state.rover;
  if (pressed('KeyV')) { state.instrLock = !state.instrLock; sfx.servo(); }
  const instr = down.has('Tab') || state.instrLock;
  if (instr !== state.instr) { state.instr = instr; sfx.click(); }
  driveRover(dt);
  if (pressed('KeyE') || pressed('Space')) act();
  else if (pressed('Enter')) {
    if (landerDist() <= tune.board_radius) {
      if (state.launchAsk > 0) { state.launchAsk = 0; state.depart = state.t; endMission('depart'); return; }
      state.launchAsk = 3; sfx.beep(660);
      radio(`CDR: Launch now, ${fmtH(state.depart - state.t)} early? ENTER again to go.`, C.white);
    } else act();
  } else if (pressed('KeyZ')) { R.v = 0; sfx.servo(); advance(tune.wait_hours, 'wait'); }
  if (state.endKind) return;
  advance(dt * tune.time_scale, 'live');
  if (state.endKind) return;
  // the mission area: leave it and Houston starts a countdown
  if (!inArea(R.x, R.y)) {
    if (state.oob === 0) { radio('CAPCOM: Ridge Base, Houston. You are leaving the mission area. Turn back now.', C.red); sfx.warn(); state.obj = objective(); }
    state.oob += dt;
    if (state.oob >= tune.oob_seconds) { radio('CAPCOM: Ridge Base, we are calling the abort. Mission is over.', C.red); endMission('oob'); return; }
  } else if (state.oob > 0) { state.oob = 0; radio('CAPCOM: We see you back inside the box. Thank you, Ridge Base.', C.ui); sfx.link(); state.obj = objective(); }
  state.skyT += dt;
  if (state.skyT >= 0.2) { state.skyT = 0; checkSky(); if (!state.endKind) state.obj = objective(); }
  lightTick(state.t); relight();
}

const scenes = {
  figures: {
    update(dt) { state.anim += dt; },
    draw() {
      clearGrid(); fx.sun = null; fx.earth = null;
      box(0, 0, COLS, ROWS, C.uiDim, 'FIGURES · EVERY UNIT AND STATION', C.ui);
      const item = (c, r, name) => str(c - Math.floor(name.length / 2), r, name, C.uiDim);
      put(6, 6, '@', '#ffffff'); item(6, 9, 'ASTRONAUT');
      const L = { c: 26, r: 6 };
      put(L.c - 3, L.r - 1, '/', C.amber); put(L.c - 2, L.r - 1, '/', C.amber); put(L.c - 1, L.r - 1, '_', C.white); put(L.c, L.r - 1, 'A', C.white); put(L.c + 1, L.r - 1, '_', C.white); put(L.c + 2, L.r - 1, '>', C.earth);
      put(L.c - 2, L.r, '#', C.amber); str(L.c - 1, L.r, '[H]', C.white); put(L.c + 2, L.r, 'T', C.earth); item(26, 9, 'LANDER: ARRAY·HAB·DISH');
      str(44, 6, '[S]', C.amber); item(45, 9, 'SURVEY OUTCROP');
      str(60, 6, '[D]', C.white); item(61, 9, 'DRILL SITE');
      str(76, 6, '[D]', '#6fb6ff'); item(77, 9, 'TERRACE DRILL (PSR)');
      put(92, 5, '▲', C.ui); put(92, 6, '1', C.ui); item(92, 9, 'FLAG');
      put(103, 5, '┌', C.ui); put(107, 5, '┐', C.ui); put(105, 6, '+', C.ui); put(103, 7, '┘', C.ui); put(103, 7, '└', C.ui); put(107, 7, '┘', C.ui); item(105, 9, 'SCOUT');
      str(117, 6, '-=*=-', C.sun); item(119, 9, 'SUN');
      str(129, 5, '.-.', C.earth); str(129, 6, '(D)', C.white); str(129, 7, "'-'", C.earth); item(130, 9, 'EARTH');
      earthDisc(FX * 18, FY * 19, 15.5, { az: 120, el: 1 }, { az: 250, el: 3 }, true, 3); item(18, 25, 'EARTH DISC, PHASED');
      const info = composeSky(titleProf(), sunAt(14, 0), earthAt(14, 0), 28, false); item(70, 39, 'SKYLINE STRIP: RIDGES, SUN, EARTH');
      void info;
      present();
    },
  },
  title: {
    update(dt) {
      state.anim += dt;
      if (Math.floor(state.anim * 60) % 4 === 0 && state.anim < 1.6) sfx.click();
      if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; sfx.static(0.5); }
      musicUpdate({ warm: 1, home: 1 });
    },
    draw() {
      clearGrid(); fx.sun = null; fx.earth = null;
      const reveal = state.anim * 110;
      logoWord('CRATER', 2, reveal); logoWord('EXPECTATIONS', 9, reveal - 60);
      if (state.anim > 1.2) strC(16, 'A LUNAR SOUTH-POLE MISSION SIM  ·  NASA SPACE APPS 2026 · LUNAR LANDING SITE NAVIGATOR', C.uiDim);
      box(0, 18, COLS, 13, C.uiDark, 'THE SKY FROM CONNECTING RIDGE', C.uiDim);
      const info = composeSky(titleProf(), sunAt(14, 0), earthAt(14, 0), 19);
      composeSkyLabels(29, info);
      box(8, 32, 126, 7, C.uiDim, 'CONTROLS', C.ui);
      CONTROLS.forEach((c, i) => str(11, 34 + i, c, C.ui));
      if (Math.floor(state.anim * 2) % 2) strC(40, '>>  PRESS ENTER TO LAUNCH  <<', C.amber);
      strC(43, 'Sun & Earth tracks and terrain are illustrative: a playable model of the problem, not a flight prediction.', C.uiDark);
      present();
    },
  },
  play: {
    update(dt) {
      tickAnims(dt);
      if (pressed('Escape') || pressed('KeyP')) { scene = 'pause'; return; }
      if (state.dialog) {
        if (pressed('Enter') || pressed('Space') || pressed('KeyE')) {
          if (state.dialog.shown < state.dialog.text.length) state.dialog.shown = state.dialog.text.length;
          else { state.dialog = null; sfx.beep(880); }
        }
        musicUpdate(playMood());
        return;
      }
      if (state.phase === 'orbit') orbitUpdate(dt); else surfaceUpdate(dt);
      if (scene === 'play') musicUpdate(playMood());
    },
    draw() { composePlay(); present(); },
  },
  cut: {
    update(dt) {
      tickAnims(dt);
      const c = state.cut, dur = c.kind === 'landing' ? tune.cut_landing : tune.cut_launch, k = dur / CUT_BASE[c.kind], hitT = CUT_HIT[c.kind] * dur;
      c.t += dt;
      const lines = CUTS[c.kind];
      while (c.said < lines.length && c.t >= lines[c.said][0] * k) {
        let t = lines[c.said][1]; if (typeof t === 'function') t = t();
        radio(t, speakerColor(t)); c.said++;
      }
      if (!c.hit && c.t >= hitT) {
        c.hit = true; sfx.thump(c.kind === 'landing' ? 1 : 0.8);
        burst(0.5, 0.9, 120, 1.6, '#b8b0a0', ['.', '·', '∙', '•']);
      }
      const engine = c.kind === 'landing' ? (c.t < hitT ? 0.6 + 0.4 * c.t / hitT : 0) : (c.t < hitT ? 0.15 : 1 - 0.6 * Math.min(1, (c.t - hitT) / Math.max(0.1, dur - hitT)));
      lightTick(c.kind === 'landing' ? state.landOff : state.t, 3000);
      musicUpdate({ cue: 1, engine, breath: 1, warm: state.sky && state.sky.sunVis ? 1 : 0 });
      if (pressed('Enter') || pressed('Space') || pressed('Escape')) c.t = dur;
      if (c.t >= dur) finishCut();
    },
    draw() { composeCut(); present(); },
  },
  pause: {
    update() { if (pressed('Escape') || pressed('KeyP')) scene = 'play'; musicUpdate({}); },
    draw() { composePlay(); overlayBox('PAUSED', [['The Moon keeps turning. You do not.'], ['']], '[ESC] RESUME'); present(); },
  },
  over: {
    update(dt) {
      tickAnims(dt); musicUpdate({ cold: 1, hollow: 1 });
      if (pressed('KeyR')) { startMission(state.mi); state.scores[state.mi] = undefined; scene = 'play'; }
      else if (pressed('Enter')) nextMission();
    },
    draw() {
      composePlay();
      const sc = state.scores[state.mi] || { sent: 0, lost: 0 }, kind = state.endKind;
      const km = state.rover ? landerDist().toFixed(1) : '?';
      const T = {
        dead: ['BATTERY DEPLETED · MISSION ENDED EARLY', 'The rover went dark before departure.', 'Rest at the array and stay in the light: the ridge decides when you charge.'],
        stranded: ['ASCENT WINDOW CLOSED · CREW LEFT BEHIND', `The lander had to go. You were ${km} km out on the rover.`, 'The ascent clock never stops. Turn for home while there is still light to drive by.'],
        oob: ['MISSION ABORTED · LEFT THE MISSION AREA', `Houston called the abort after ${tune.oob_seconds} seconds outside the box.`, 'The dotted red line on the map is the edge. Stay inside it.'],
      }[kind] || ['MISSION ENDED', '', ''];
      overlayBox(T[0], [
        [T[1], C.red], [''],
        [`SCIENCE THAT REACHED EARTH   ${sc.sent}`, C.earth], [`LOST ON THE ROVER            ${sc.lost}`, C.red], [''],
        [T[2], C.uiDim],
      ], '[R] RETRY MISSION     [ENTER] NEXT MISSION', C.red);
      present();
    },
  },
  results: {
    update(dt) {
      tickAnims(dt); musicUpdate({ home: 1, warm: 1 });
      if (pressed('Enter')) nextMission();
      if (pressed('KeyR')) { startMission(state.mi); state.scores[state.mi] = undefined; scene = 'play'; }
    },
    draw() {
      composePlay();
      const sc = state.scores[state.mi] || { sent: 0, lost: 0 };
      const last = state.mi === MISSIONS.length - 1;
      const lines = [[`CREW HOME · MISSION ${state.mi + 1}: ${mission().name}`, C.amber], [''],
        [`SCIENCE THAT REACHED EARTH   ${sc.sent}`, C.earth], [`LEFT UNSENT ON THE ROVER     ${sc.lost}`, sc.lost ? C.red : C.uiDim], ['']];
      if (last) {
        state.scores.forEach((s, i) => lines.push([`MISSION ${i + 1}   ${String(s ? s.sent : 0).padStart(4)}`, C.ui]));
        lines.push([`TOTAL SCIENCE HOME   ${state.score}`, C.amber]);
        const grade = state.score >= 420 ? 'FLIGHT DIRECTOR' : state.score >= 260 ? 'MISSION PLANNER' : state.score >= 120 ? 'HORIZON READER' : 'CADET';
        lines.push(['']); lines.push([`RATING: ${grade}`, C.sun]);
      } else lines.push(['Next: a new sky, a harder trade.', C.uiDim]);
      overlayBox(last ? 'CAMPAIGN COMPLETE' : 'MISSION COMPLETE', lines, last ? '[ENTER] BACK TO TITLE   [R] RETRY' : '[ENTER] NEXT MISSION   [R] RETRY');
      present();
    },
  },
};

function nextMission() {
  if (state.mi < MISSIONS.length - 1) { startMission(state.mi + 1); scene = 'play'; }
  else { scene = 'title'; state.anim = 0; }
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
