    radio(`ARRAY: Low-power wait, ${tune.rest_hours} h. ${s.lSun ? 'Charging.' : 'No sun: slow drain.'}`, C.amber); sfx.servo(); advance(tune.rest_hours, 'rest');

    radio(`CAPCOM: Copy ${Math.round(n)} points, Ridge Base. ${state.data > 0 ? Math.round(state.data) + ' still on board.' : 'Board is clear.'}`, C.earth);
    events.push({ type: 'transmit', n });

  } else if (st.kind === 'survey') {

    if (!s.sunVis) { radio('CDR: Sun is hidden here. Survey needs light. Wait (Z) or drive.', C.amber); sfx.warn(); return; }
    const y = tune.survey_yield * (state.calibrated ? tune.calibrate_bonus : 1);
    state.data += y; state.calibrated = false; state.uses[st.id] = usesLeft(st.id) - 1;

    advance(tune.survey_hours, 'work');
  } else if (st.kind === 'drill' || st.kind === 'psr') {
    if (usesLeft(st.id) <= 0) { radio('DRILL: Site exhausted.', C.uiDim); return; }
    if (state.battery < tune.drill_reserve) { radio(`DRILL: Needs ${tune.drill_reserve}% battery reserve.`, C.red); sfx.warn(); return; }
    const y = tune.drill_yield * (st.kind === 'psr' ? tune.psr_drill_mult : 1);

    radio(`DRILL: Core recovered, +${Math.round(y)} points${st.kind === 'psr' ? ' (frozen volatiles!)' : ''}.`, st.kind === 'psr' ? C.earth : C.white);

}
function sparkle(color) {

}
/** First-person particles, in view coordinates (u, v from 0 to 1): they fly on ballistic arcs, no air. */

    u: u + (rng() - 0.5) * spread * 0.4, v: v - rng() * 0.03, vu: (rng() - 0.5) * spread * 1.6, vv: -(0.15 + rng() * 0.45),

// ---- The rover: real-time driving on the heightfield ------------------------------------
const DRIVE_KEYS = { fw: ['KeyW', 'ArrowUp'], bk: ['KeyS', 'ArrowDown'], lt: ['KeyA', 'ArrowLeft'], rt: ['KeyD', 'ArrowRight'] };
/**
 * One physics step. W/S throttle and brake, A/D steer (smoothed); slopes pull the rover back and cap its
 * speed; anything steeper than slope_max stops it dead. The chassis rides the ground on a spring, so
 * sharp changes in the ground's rise thump through the cabin. Driving costs battery by the km.
 */
function driveRover(dt) {
  const R = state.rover, k = list => list.some(c => down.has(c));
  const thr = (k(DRIVE_KEYS.fw) ? 1 : 0) - (k(DRIVE_KEYS.bk) ? 1 : 0);
  const steer = (k(DRIVE_KEYS.rt) ? 1 : 0) - (k(DRIVE_KEYS.lt) ? 1 : 0);
  const vmax = tune.rover_speed;
  R.steer += (steer - R.steer) * Math.min(1, dt * 7);
  const sp = Math.abs(R.v) / vmax;
  R.hd = (R.hd + R.steer * tune.rover_turn * (0.45 + 0.55 * Math.min(1, sp * 2.5)) * dt + 360) % 360;
  const a = R.hd * D2R, fx = Math.sin(a), fy = -Math.cos(a), e = 0.03;
  const grade = (hgt(R.x + fx * e, R.y + fy * e) - hgt(R.x - fx * e, R.y - fy * e)) / (2 * e);
  const side = (hgt(R.x - fy * e, R.y + fx * e) - hgt(R.x + fy * e, R.y - fx * e)) / (2 * e);
  if (thr) R.v += thr * (R.v * thr < 0 ? tune.rover_brake + tune.rover_accel : tune.rover_accel) * dt;
  else { const dv = tune.rover_brake * dt; R.v = Math.abs(R.v) <= dv ? 0 : R.v - Math.sign(R.v) * dv; }
  if (R.v !== 0) R.v -= grade * tune.rover_grav * dt;
  const top = vmax * Math.max(0.25, 1 - Math.max(0, grade * Math.sign(R.v)) * 1.2);
  R.v = clamp(R.v, -vmax * tune.rover_reverse, Math.max(top, 0));
  if (R.v < 0 && R.v < -top * tune.rover_reverse) R.v = -top * tune.rover_reverse;
  // too steep: the wheels spin out, the rover stops
  if (Math.abs(R.v) > 0.002 && grade * Math.sign(R.v) > tune.slope_max) {
    R.v = -R.v * 0.15; sfx.bump(0.5);
    radioOnce('steep', 4, `CDR: Too steep, ${Math.round(Math.atan(Math.abs(grade)) * R2D)}°. Find another line.`, C.red);
  }
  let nx = R.x + fx * R.v * dt, ny = R.y + fy * R.v * dt;
  const cx = clamp(nx, HGF.x0 + 1, HGF.x0 + (HGF.nx - 1) * HGF.q - 1), cy = clamp(ny, HGF.y0 + 1, HGF.y0 + (HGF.ny - 1) * HGF.q - 1);
  if (cx !== nx || cy !== ny) { R.v = 0; nx = cx; ny = cy; }
  const moved = Math.hypot(nx - R.x, ny - R.y);
  R.x = nx; R.y = ny; R.dist += moved;
  state.battery = Math.max(0, state.battery - moved * tune.drain_drive); state.battMin = Math.min(state.battMin, state.battery);
  const last = state.track[state.track.length - 1];
  if (!last || Math.hypot(last.x - R.x, last.y - R.y) > 0.035) { state.track.push({ x: R.x, y: R.y }); if (state.track.length > 2000) state.track.shift(); }
  // suspension: the ground's rise rate changing fast is a bump
  const g0 = hgt(R.x, R.y), gv = (g0 - R.g) / dt, jolt = Math.abs(gv - R.gv);
  R.g = g0; R.gv = gv; R.z = g0;
  R.rough = Math.min(1, jolt * 60);
  if (jolt > 0.012 && Math.abs(R.v) > 0.04 && state.anim - R.lastBump > 0.18) { sfx.bump(Math.min(1, jolt / 0.03)); R.lastBump = state.anim; R.bobV += Math.min(0.03, jolt) * 0.03; }
  R.bobV += (-R.bob * 140 - R.bobV * 9) * dt + (hash2(Math.floor(R.dist * 400), 3) - 0.5) * sp * 0.00002;
  R.bob += R.bobV * dt;
  R.pitch += (Math.atan(grade) * R2D - R.pitch) * Math.min(1, dt * 5);
  R.roll += (Math.atan(side) * R2D - R.roll) * Math.min(1, dt * 5);
  R.grade = grade;
  R.eye = R.z + tune.eye_h + R.bob;
  state.player = cellOf(R.x, R.y);
  // dust kicked off the wheels flies on clean arcs (no air to hold it)
  if (sp > 0.15) {
    const n = Math.floor(sp * 70 * dt + rng());
    for (let i = 0; i < n; i++) {
      const sideU = rng() < 0.5 ? 0.1 + rng() * 0.08 : 0.82 + rng() * 0.08;
      state.vfx.push({ u: sideU, v: 0.93, vu: (sideU < 0.5 ? -1 : 1) * (0.05 + rng() * 0.15), vv: -(0.2 + rng() * 0.35 * sp), life: 0.6 + rng() * 0.5, ch: rng() < 0.5 ? '·' : '∙', color: '#a89f8f' });
    }
  }
}
/** One line that says what matters now, and where it is. */
function objective() {
  const R = state.rover, s = state.sky, L = kmOf(state.land.c, state.land.r), toDep = state.depart - state.t, A = SITE.area;
  if (state.oob > 0) return { text: 'OUTSIDE THE MISSION AREA · TURN BACK', x: clamp(R.x, A.x0 + 0.6, A.x1 - 0.6), y: clamp(R.y, A.y0 + 0.6, A.y1 - 0.6), col: C.red, tag: 'MISSION AREA' };
  const backH = landerDist() / tune.rover_speed * tune.time_scale * 1.6 + 1;
  if (toDep < backH + 2 || toDep < 3) return { text: `RETURN TO THE LANDER · ASCENT IN ${fmtH(toDep)}`, ...L, col: C.red, tag: 'LANDER' };
  if (state.battery < tune.danger_batt && !s.sunVis) return { text: 'BATTERY LOW · GET INTO SUNLIGHT OR REST AT THE ARRAY', x: L.x - 0.6, y: L.y, col: C.amber, tag: 'ARRAY' };
  if (state.data > 0 && s.lEarth) return { text: `SEND ${Math.round(state.data)} POINTS HOME · DISH AT THE LANDER`, x: L.x + 0.6, y: L.y, col: C.earth, tag: 'DISH' };
  let best = null, bd = 1e9;
  const sun = sunAt(state.t);
  for (const st of stationList()) {
    if (!st.id || usesLeft(st.id) <= 0) continue;
    if (st.kind === 'survey' && !visible(profile(st.c, st.r), sun)) continue;
    if (st.kind !== 'survey' && state.battery < tune.drill_reserve + 4) continue;
    const d = Math.hypot(st.x - R.x, st.y - R.y);
    if (d < bd) { bd = d; best = st; }
  }
  if (best) return { text: best.kind === 'survey' ? `${best.name} IS IN SUNLIGHT · SURVEY IT` : `CORE ${best.name}${best.kind === 'psr' ? ' · PAYS ×' + tune.psr_drill_mult + ', COLD' : ''}`, x: best.x, y: best.y, col: best.kind === 'survey' ? C.amber : best.kind === 'psr' ? '#6fb6ff' : C.white, tag: best.name };
  if (state.data > 0) return { text: `DISH IS BLIND · EARTHRISE AT THE LANDER IN ${fmtH(s.lEarthNext)}`, x: L.x + 0.6, y: L.y, col: C.earth, tag: 'DISH' };
  return { text: 'NOTHING LIT TO WORK · WAIT (Z) OR DRIVE INTO THE LIGHT', ...L, col: C.uiDim, tag: 'LANDER' };
}

// ---- Drawing ----------------------------------------------------------------------------
const SKY_R0 = 2, SKY_ROWS = 10, SKY_C0 = 1, SKY_COLS = 140, EL_MAX = 5.2, EL_MIN = -1.3;
function fmtH(h) { return h === null ? '>200h' : h < 10 ? h.toFixed(1) + 'h' : Math.round(h) + 'h'; }
function sgn(v, d = 2) { return (v >= 0 ? '+' : '') + v.toFixed(d); }
const SUN_RAMP = ['#7a3a10', '#c0601c', '#ff9a3a', '#ffc76a', '#ffe7a8', '#fffbe8'];
/**
 * The Sun as a dot-matrix disc: a white-hot core, limb-darkened to amber, a corona of fading dots
 * and eight thin rays. (cx, cy) is the centre in fine cells, R its radius in fine columns.
 * clip(fc, fr) says whether a fine cell is open sky; dim draws it as a ghost behind the ridge.
 */
function sunDisc(cx, cy, R, clip, dim, t) {
  const RY = R * FW / FH, ext = R * 2.6, ey = ext * FW / FH;
  for (let y = -Math.ceil(ey); y <= Math.ceil(ey); y++) for (let x = -Math.ceil(ext); x <= Math.ceil(ext); x++) {
    const fc = cx + x, fr = cy + y;
    if (clip && !clip(fc, fr)) continue;
    const nx = x / R, ny = y / RY, q = Math.sqrt(nx * nx + ny * ny);
    if (dim) { if (q > 0.85 && q < 1.15 && hash2(x + 40, y + 40) < 0.7) fput(fc, fr, '·', C.amberDim); continue; }
    if (q <= 1) { // limb darkening: brightness falls toward the edge
      const I = 0.35 + 0.65 * Math.sqrt(1 - q * q);
      fput(fc, fr, I > 0.8 ? '●' : I > 0.6 ? '•' : '∙', SUN_RAMP[Math.min(5, Math.floor(I * 6))]);
    } else { // corona and rays
      const a = Math.atan2(ny, nx), ray = Math.pow(Math.abs(Math.cos(a * 4 + t * 0.2)), 40);
      const fall = Math.max(0, 1 - (q - 1) / 1.6), k = fall * fall * (0.55 + ray * 1.2) - hash2(x * 5 + 1, y * 3 + 2) * 0.35;
      if (k > 0.05) fput(fc, fr, k > 0.55 ? '•' : k > 0.3 ? '∙' : k > 0.15 ? '·' : '.', k > 0.4 ? '#ffd890' : k > 0.2 ? '#d08a3a' : '#7a4a1c');
    }
  }
}
/**
 * The Earth as a dot-matrix disc showing its true phase: oceans, land and cloud turn with the hours,
 * the night side stays black. RX is the radius in fine columns.
 */
function earthDisc(cx, cy, RX, sun, earth, vis, t, clip) {
  const ph = earthPhase(sun, earth), th = (180 - ph.sep) * D2R;
  const Lx = Math.sin(th) * ph.side, Lz = Math.cos(th), RY = RX * FW / FH, rot = t * 15;
  for (let y = -Math.ceil(RY); y <= Math.ceil(RY); y++) for (let x = -Math.ceil(RX); x <= Math.ceil(RX); x++) {
    const nx = x / RX, ny = y / RY, q = nx * nx + ny * ny;
    if (q > 1) continue;
    const fc = cx + x, fr = cy + y;
    if (clip && !clip(fc, fr)) continue;
    if (!vis) { if (q > 0.8) fput(fc, fr, '.', C.earthDim); continue; }
    const nz = Math.sqrt(1 - q), I = nx * Lx + nz * Lz;
    const lon = Math.atan2(nx, nz) * R2D + rot, lat = Math.asin(Math.max(-1, Math.min(1, -ny))) * R2D;
    const land = vnoise(lon / 38 + 50, lat / 30 + 20) > 0.6, ice = Math.abs(lat) > 68;
    if (I <= 0.03) { // the night side: faint, so a "new Earth" can still be found; a blue rim of air, city lights on land
      if (q > 0.86) fput(fc, fr, dotOf(0.32), '#2c5c9c');
      else if (land && !ice && hash2(Math.round(lon * 2), Math.round(lat * 2)) < 0.12) fput(fc, fr, dotOf(0.3), '#d8a050');
      else fput(fc, fr, dotOf(0.14), land ? '#1c2434' : '#11264a');
      continue;
    }
    const cl = vnoise(lon / 18 + 3 + t * 0.02, lat / 9 + 8) * 0.7 + vnoise(lon / 7, lat / 5) * 0.3;
    const k = Math.min(1, I * 1.15 + 0.05);
    let col;
    if (cl > 0.62 || ice) col = k > 0.6 ? '#f4f8ff' : k > 0.3 ? '#b8c8dc' : '#5d6e84';
    else if (land) col = k > 0.6 ? '#a89a5c' : k > 0.3 ? '#6f6a3e' : '#3c3a24';
    else col = k > 0.6 ? '#4a9cff' : k > 0.3 ? '#2a6ac0' : '#173c70';
    fput(fc, fr, dotOf(Math.min(0.99, k * (cl > 0.62 ? 1.1 : 0.95))), col);
  }
}
/** The 360° skyline strip: the real horizon from the cell, in dots, with the Sun and Earth on it. */
function composeSky(p, sun, earth, r0 = SKY_R0, rowsC = SKY_ROWS, withFx = true) {
  const NF = rowsC * FY, fr0 = r0 * FY, fc0 = SKY_C0 * FX, NCF = SKY_COLS * FX, rowH = (EL_MAX - EL_MIN) / NF;
  const colOf = az => fc0 + Math.floor((((az % 360) + 360) % 360) / 360 * NCF) % NCF;
  const elOf = fr => EL_MAX - (fr - fr0 + 0.5) * rowH;
  const hzc = new Float32Array(NCF);
  const sunVis = visible(p, sun), hzSun = horizonAt(p, sun.az), clip = sunVis && sun.el - hzSun < 0.7;
  for (let i = 0; i < NCF; i++) {
    const az = (i + 0.5) * 360 / NCF, hz = hzc[i] = horizonAt(p, az);
    const dS = Math.abs(angDiff(az, sun.az)), glow = clip && dS < 14;
    for (let k = 0; k < NF; k++) {
      const top = EL_MAX - k * rowH, bot = top - rowH, fc = fc0 + i, fr = fr0 + k;
      if (hz >= top) { // the ridge: bright dots on the crest, fading into the body
        const depth = (hz - top) / rowH, f = Math.max(0, 1 - depth / 14) - hash2(i * 3, k * 5) * 0.25;
        if (f > 0.05) fput(fc, fr, glow && depth < 3 ? (dS < 5 ? '●' : '•') : dotOf(f * 0.75), glow && depth < 3 ? (dS < 5 ? '#ffcf7a' : '#a8743a') : f > 0.6 ? '#8a929e' : f > 0.3 ? '#555c68' : '#30353d');
      } else if (hz > bot) { // the crest line, sized by how much of the cell it fills
        fput(fc, fr, dotOf(0.35 + (hz - bot) / rowH * 0.6), glow ? '#ffd890' : '#b4bcc8');
      } else {
        const hs = hash2(i * 13 + 5, k * 31 + 7);
        if (Math.abs(top - rowH / 2) < rowH / 2 && i % 4 === 0) fput(fc, fr, '·', C.uiDark); // 0° ideal horizon
        else if (hs < 0.012) fput(fc, fr, '.', C.starDim); else if (hs < 0.017) fput(fc, fr, '·', C.star); else if (hs < 0.019) fput(fc, fr, '•', C.white);
      }
    }
  }
  const sky = (fc, fr) => fr >= fr0 && fr < fr0 + NF && elOf(fr) > hzc[(((fc - fc0) % NCF) + NCF) % NCF];

function tickAnims(dt) {
  state.anim += dt;
  for (const q of state.particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92; q.vy *= 0.92; q.life -= dt; }
  state.particles = state.particles.filter(q => q.life > 0);
  for (const q of state.vfx) { q.u += q.vu * dt; q.v += q.vv * dt; q.vv += 0.9 * dt; q.life -= dt; }
  state.vfx = state.vfx.filter(q => q.life > 0 && q.v < 1.02);
  for (const p of state.pulses) p.t += dt;
  state.pulses = state.pulses.filter(p => p.t < 1.1);
  for (const m of state.msgs) {
    m.age += dt;
    if (m.shown < m.text.length) { m.shown += 70 * dt; if (Math.floor(m.shown) % 3 === 0) sfx.click(); }
    else if (m.capcom && !m.closed) { m.closed = true; sfx.quindar(false); } // the out-tone: CAPCOM is done talking
  }
  if (state.dialog && state.dialog.shown < state.dialog.text.length) { state.dialog.shown += 75 * dt; sfx.click(); }
  if (state.launchAsk > 0) state.launchAsk = Math.max(0, state.launchAsk - dt);
}
/** What the music should feel: every layer reads the world, so the score tells you the stakes before the HUD does. */
function playMood() {
  const s = state.sky;
  if (!s) return { warm: 1, home: 1 };
  if (state.phase === 'orbit') return { warm: s.sunVis ? 1 : 0, cold: s.sunVis ? 0 : 1, home: s.earthVis ? 1 : 0 };
  const R = state.rover, toDep = state.depart - state.t, away = landerDist() > tune.board_radius;
  const dusk = s.sunVis && s.sunNext !== null && s.sunNext < tune.dusk_hours ? 1 - s.sunNext / tune.dusk_hours : 0;
  const battD = state.battery < tune.danger_batt ? 0.35 + 0.65 * (1 - state.battery / tune.danger_batt) : 0;
  const depD = away && toDep < tune.danger_depart ? 0.35 + 0.65 * (1 - toDep / tune.danger_depart) : 0;
  const danger = clamp(Math.max(battD, depD), 0, 1);
  const oob = state.oob > 0 ? clamp(0.3 + 0.7 * state.oob / tune.oob_seconds, 0, 1) : 0;
  const sp = Math.abs(R.v) / tune.rover_speed;
  return {
    warm: s.sunVis ? 1 : 0, cold: s.sunVis ? 0 : 1, dusk, home: s.lEarth ? 1 : 0, hollow: s.earthVis || s.lEarth ? 0 : 1,
    danger, oob, speed: sp, steer: Math.abs(R.steer) * Math.min(1, sp * 2), rough: R.rough * Math.min(1, sp * 3),
    breath: 1, tension: danger > 0 || dusk > 0.5 ? 1 : 0,
  };
}

/** The surface, in real time: drive, work, launch, and the clock never stops. */
function surfaceUpdate(dt) {
  const R = state.rover;
  if (pressed('KeyV')) { state.instrLock = !state.instrLock; sfx.servo(); }
  const instr = down.has('Tab') || state.instrLock;
  if (instr !== state.instr) { state.instr = instr; sfx.click(); }
  driveRover(dt);
  if (pressed('KeyE') || pressed('Space')) act();
  else if (pressed('Enter')) {
    if (landerDist() <= tune.board_radius) {
      if (state.launchAsk > 0) { state.launchAsk = 0; state.depart = state.t; endMission('depart'); return; }

    if (state.oob === 0) { radio('CAPCOM: Ridge Base, Houston. You are leaving the mission area. Turn back now.', C.red); sfx.warn(); state.obj = objective(); }
    state.oob += dt;

}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
</html>
