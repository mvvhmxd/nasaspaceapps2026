  if (!s) return { warm: 1, home: 1 };
  const sunNear = s.sunVis && s.sunNext !== null && s.sunNext < 6;
  const earthNear = state.phase === 'surface' && s.lEarth && s.lEarthNext !== null && s.lEarthNext < 6 && state.data > 0;
  const depNear = state.phase === 'surface' && state.depart - state.t < 6;
  return { warm: s.sunVis, cold: !s.sunVis, home: state.phase === 'surface' ? s.lEarth : s.earthVis, tension: sunNear || earthNear || depNear || state.battery < 20, breath: state.phase === 'surface' };
}
const scenes = {
  figures: {
    update(dt) { state.anim += dt; },
    draw() {
      clearGrid(); fx.sun = null; fx.earth = null;
      box(0, 0, COLS, ROWS, C.uiDim, 'FIGURES · EVERY UNIT AND STATION', C.ui);
      const item = (c, r, name) => str(c - Math.floor(name.length / 2), r, name, C.uiDim);
      put(6, 6, '@', '#ffffff'); item(6, 9, 'ASTRONAUT');
      const L = { c: 26, r: 6 };
      put(L.c - 3, L.r - 1, '/', C.amber); put(L.c - 2, L.r - 1, '/', C.amber); put(L.c - 1, L.r - 1, '_', C.white); put(L.c, L.r - 1, 'A', C.white); put(L.c + 1, L.r - 1, '_', C.white); put(L.c + 2, L.r - 1, '>', C.earth);
      put(L.c - 2, L.r, '#', C.amber); str(L.c - 1, L.r, '[H]', C.white); put(L.c + 2, L.r, 'T', C.earth); item(26, 9, 'LANDER: ARRAY·HAB·DISH');
      str(44, 6, '[S]', C.amber); item(45, 9, 'SURVEY OUTCROP');
      str(60, 6, '[D]', C.white); item(61, 9, 'DRILL SITE');
      str(76, 6, '[D]', '#6fb6ff'); item(77, 9, 'TERRACE DRILL (PSR)');
      put(92, 5, '▲', C.ui); put(92, 6, '1', C.ui); item(92, 9, 'FLAG');
      put(103, 5, '┌', C.ui); put(107, 5, '┐', C.ui); put(105, 6, '+', C.ui); put(103, 7, '┘', C.ui); put(103, 7, '└', C.ui); put(107, 7, '┘', C.ui); item(105, 9, 'SCOUT');
      str(117, 6, '-=*=-', C.sun); item(119, 9, 'SUN');
      str(129, 5, '.-.', C.earth); str(129, 6, '(D)', C.white); str(129, 7, "'-'", C.earth); item(130, 9, 'EARTH');
      earthDisc(FX * 18, FY * 19, 15.5, { az: 120, el: 1 }, { az: 250, el: 3 }, true, 3); item(18, 25, 'EARTH DISC, PHASED');
      const info = composeSky(titleProf(), sunAt(14, 0), earthAt(14, 0), 28, false); item(70, 39, 'SKYLINE STRIP: RIDGES, SUN, EARTH');
      void info;
      present();
    },
  },
  title: {
    update(dt) {
      state.anim += dt;
      if (Math.floor(state.anim * 60) % 4 === 0 && state.anim < 1.6) sfx.click();
      if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; sfx.static(0.5); }
      musicUpdate({ warm: 1, home: 1 });
    },
    draw() {
      clearGrid(); fx.sun = null; fx.earth = null;
      const reveal = state.anim * 110;
      logoWord('CRATER', 2, reveal); logoWord('EXPECTATIONS', 9, reveal - 60);
      if (state.anim > 1.2) strC(16, 'A LUNAR SOUTH-POLE MISSION SIM  ·  NASA SPACE APPS 2026 · LUNAR LANDING SITE NAVIGATOR', C.uiDim);
      box(0, 18, COLS, 13, C.uiDark, 'THE SKY FROM CONNECTING RIDGE', C.uiDim);
      const info = composeSky(titleProf(), sunAt(14, 0), earthAt(14, 0), 19);
      composeSkyLabels(29, info);
      box(8, 32, 126, 7, C.uiDim, 'CONTROLS', C.ui);
      CONTROLS.forEach((c, i) => str(11, 34 + i, c, C.ui));
      if (Math.floor(state.anim * 2) % 2) strC(40, '>>  PRESS ENTER TO LAUNCH  <<', C.amber);
      strC(43, 'Sun & Earth tracks and terrain are illustrative: a playable model of the problem, not a flight prediction.', C.uiDark);
      present();
    },
  },
  play: {
    update(dt) {
      tickAnims(dt);
      musicUpdate(playMood());
      if (pressed('Escape') || pressed('KeyP')) { scene = 'pause'; return; }
      if (state.dialog) {
        if (pressed('Enter') || pressed('Space') || pressed('KeyE')) {
          if (state.dialog.shown < state.dialog.text.length) state.dialog.shown = state.dialog.text.length;
          else { state.dialog = null; sfx.beep(880); }
        }
        return;
      }
      if (pressed('KeyV')) { state.view = state.view === 'pov' ? 'map' : 'pov'; sfx.servo(); }
      const pov = state.view === 'pov';
      if (state.phase === 'surface' && pov) { // the visor: look with A/D, walk the way you face with W/S
        const tl = repeatKey('tl', ['ArrowLeft', 'KeyA'], dt, tune.turn_repeat), tr = repeatKey('tr', ['ArrowRight', 'KeyD'], dt, tune.turn_repeat);
        if (tl || tr) { state.hd = (state.hd + (tr ? 1 : -1) * tune.turn_step + 360) % 360; sfx.click(); }
        const fw = repeatKey('fw', ['ArrowUp', 'KeyW'], dt, tune.hold_repeat), bk = repeatKey('bk', ['ArrowDown', 'KeyS'], dt, tune.hold_repeat);
        if (fw || bk) { const [dc, dr] = DIR8[dir8(state.hd)]; tryStep(fw ? dc : -dc, fw ? dr : -dr); }
        else if (pressed('KeyE') || pressed('Space') || pressed('Enter')) act();
        else if (pressed('KeyZ')) { sfx.servo(); advance(tune.wait_hours, 'wait'); }
        return;
      }
      if (state.phase === 'orbit' && pov) {
        const tl = repeatKey('tl', ['KeyQ', 'Comma'], dt, tune.turn_repeat), tr = repeatKey('tr', ['KeyE', 'Period'], dt, tune.turn_repeat);
        if (tl || tr) { state.hd = (state.hd + (tr ? 1 : -1) * tune.turn_step + 360) % 360; sfx.click(); }
      }
      const mv = moveInput(dt);
      if (state.phase === 'orbit') {
        if (mv) {
          state.cursor.c = Math.max(0, Math.min(MC - 1, state.cursor.c + mv[0]));
          state.cursor.r = Math.max(0, Math.min(MR - 1, state.cursor.r + mv[1]));
          updateSky(); sfx.telemetry();
        }
        if (pressed('KeyF')) {
          if (state.flags.length >= 3) state.flags.shift();
          state.flags.push({ c: state.cursor.c, r: state.cursor.r }); sfx.beep(1046);
          const st = statsFor(state.cursor.c, state.cursor.r);
          radio(`FLAG ${state.flags.length}: Sun ${st.sun}% · Earth ${st.earth}% over the mission.`, C.ui);
        }
        ['Digit1', 'Digit2', 'Digit3'].forEach((k, i) => { if (pressed(k) && state.flags[i]) { state.cursor = { ...state.flags[i] }; updateSky(); sfx.beep(); } });
        const lo = state.landMin, hi = state.landMin + tune.land_window;
        if (pressed('BracketRight') && state.landOff < hi) { state.landOff = Math.min(hi, state.landOff + tune.scrub_step); updateSky(); sfx.servo(); }
        if (pressed('BracketLeft') && state.landOff > lo) { state.landOff = Math.max(lo, state.landOff - tune.scrub_step); updateSky(); sfx.servo(); }
        if (pressed('Enter') || pressed('Space')) land();
      } else {
        if (mv) tryStep(mv[0], mv[1]);
        else if (pressed('KeyE') || pressed('Space') || pressed('Enter')) act();
        else if (pressed('KeyZ')) { sfx.servo(); advance(tune.wait_hours, 'wait'); }
      }
    },
    draw() { composePlay(); present(); },
  },
  pause: {
    update() { if (pressed('Escape') || pressed('KeyP')) scene = 'play'; musicUpdate({}); },
    draw() { composePlay(); overlayBox('PAUSED', [['The Moon keeps turning. You do not.'], ['']], '[ESC] RESUME'); present(); },
  },
  over: {
    update(dt) {
      tickAnims(dt); musicUpdate({ cold: 1 });
      if (pressed('KeyR')) { startMission(state.mi); state.scores[state.mi] = undefined; scene = 'play'; }
      else if (pressed('Enter')) nextMission();
    },
    draw() {
      composePlay();
      const sc = state.scores[state.mi] || { sent: 0, lost: 0 };
      overlayBox('BATTERY DEPLETED · MISSION ENDED EARLY', [
        ['The suit went dark before departure.', C.red], [''],
        [`SCIENCE THAT REACHED EARTH   ${sc.sent}`, C.earth], [`LOST ON THE SUIT             ${sc.lost}`, C.red], [''],
        ['Rest at the array and stay in the light: the ridge decides when you charge.', C.uiDim],
      ], '[R] RETRY MISSION     [ENTER] NEXT MISSION', C.red);
      present();
    },
  },
  results: {
    update(dt) {
      tickAnims(dt); musicUpdate({ home: 1, warm: 1 });
      if (pressed('Enter')) nextMission();
      if (pressed('KeyR')) { startMission(state.mi); state.scores[state.mi] = undefined; scene = 'play'; }
    },
    draw() {
      composePlay();
      const sc = state.scores[state.mi] || { sent: 0, lost: 0 };
      const last = state.mi === MISSIONS.length - 1;
      const lines = [[`DEPARTURE · MISSION ${state.mi + 1}: ${mission().name}`, C.amber], [''],
        [`SCIENCE THAT REACHED EARTH   ${sc.sent}`, C.earth], [`LEFT UNSENT ON THE SUIT      ${sc.lost}`, sc.lost ? C.red : C.uiDim], ['']];
      if (last) {
        state.scores.forEach((s, i) => lines.push([`MISSION ${i + 1}   ${String(s ? s.sent : 0).padStart(4)}`, C.ui]));
        lines.push([`TOTAL SCIENCE HOME   ${state.score}`, C.amber]);
        const grade = state.score >= 420 ? 'FLIGHT DIRECTOR' : state.score >= 260 ? 'MISSION PLANNER' : state.score >= 120 ? 'HORIZON READER' : 'CADET';
        lines.push(['']); lines.push([`RATING: ${grade}`, C.sun]);
      } else lines.push(['Next: a new sky, a harder trade.', C.uiDim]);
      overlayBox(last ? 'CAMPAIGN COMPLETE' : 'MISSION COMPLETE', lines, last ? '[ENTER] BACK TO TITLE   [R] RETRY' : '[ENTER] NEXT MISSION   [R] RETRY');
      present();
    },
  },
};
function nextMission() {
  if (state.mi < MISSIONS.length - 1) { startMission(state.mi + 1); scene = 'play'; }
  else { scene = 'title'; state.anim = 0; }
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
